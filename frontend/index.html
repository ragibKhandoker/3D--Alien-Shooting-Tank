<!doctype html>
<html lang="en" ng-app="tankApp">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tank Survival 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="node_modules/angular/angular.min.js"></script>
  <script src="node_modules/angular-route/angular-route.min.js"></script>
  <script src="js/app.js"></script>
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <nav class="nav" ng-controller="NavController as nav">
    <a href="#!/" class="brand">
      <svg class="brand-logo" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="3" y="17" width="26" height="8" rx="3" fill="currentColor" opacity=".9"/>
        <rect x="9" y="11" width="13" height="7" rx="2" fill="currentColor"/>
        <rect x="21" y="13" width="9" height="2.6" rx="1.3" fill="currentColor"/>
        <circle cx="8" cy="25" r="2.4" fill="#0b0f14"/><circle cx="16" cy="25" r="2.4" fill="#0b0f14"/><circle cx="24" cy="25" r="2.4" fill="#0b0f14"/>
      </svg>
      <span>TANK SURVIVAL <em>3D</em></span>
    </a>

    <div class="nav-right" ng-if="nav.auth.isLoggedIn()">
      <div class="user-chip">
        <span class="avatar">{{ nav.auth.user().username.charAt(0) | uppercase }}</span>
        <span class="user-name">{{ nav.auth.user().username }}</span>
      </div>
      <button class="btn btn-ghost btn-sm" ng-click="nav.logout()">Log out</button>
    </div>
    <div class="nav-right" ng-if="!nav.auth.isLoggedIn()">
      <a href="#!/login" class="btn btn-ghost btn-sm">Log in</a>
      <a href="#!/register" class="btn btn-primary btn-sm">Register</a>
    </div>
  </nav>

  <div ng-view></div>

  <footer class="footer">
    <span>Tank Survival 3D</span>
    <span class="dot-sep">•</span>
    <span>Built with OpenGL, Flask &amp; AngularJS</span>
  </footer>
</body>
</html>
